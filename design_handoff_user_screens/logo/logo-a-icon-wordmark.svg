<svg width="240" height="52" viewBox="0 0 240 52" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Beer Salon">
  <defs>
    <linearGradient id="a_tile" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0a341"/>
      <stop offset="1" stop-color="#c47f28"/>
    </linearGradient>
  </defs>
  <!-- amber tile -->
  <rect x="0.75" y="0.75" width="50.5" height="50.5" rx="14" fill="url(#a_tile)"/>
  <rect x="0.75" y="0.75" width="50.5" height="50.5" rx="14" stroke="#f0c06a" stroke-opacity="0.5" stroke-width="1"/>
  <!-- beer glass (geometric) -->
  <path d="M18 20 H34 L32 40 A2 2 0 0 1 30 42 H22 A2 2 0 0 1 20 40 Z" fill="#20160a" fill-opacity="0.92"/>
  <path d="M18.9 27 H33.1 L32 40 A2 2 0 0 1 30 42 H22 A2 2 0 0 1 20 40 Z" fill="#20160a" fill-opacity="0.35"/>
  <circle cx="22" cy="20" r="3.4" fill="#20160a"/>
  <circle cx="26" cy="18.4" r="4" fill="#20160a"/>
  <circle cx="30" cy="20" r="3.4" fill="#20160a"/>
  <path d="M34 24 H38 A3 3 0 0 1 41 27 V33 A3 3 0 0 1 38 36 H34" stroke="#20160a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- wordmark: "Beer" (Zen Old Mincho) + "Salon" (Archivo). font-family requires webfont on host; falls back to serif/sans-serif. -->
  <text x="64" y="34" font-family="'Zen Old Mincho', serif" font-weight="900" font-size="27" fill="#f5e9d4">Beer<tspan font-family="'Archivo', sans-serif" font-weight="800" fill="#e0a341"> Salon</tspan></text>
  <text x="64" y="46" font-family="'Archivo', sans-serif" font-weight="600" font-size="8" letter-spacing="2.6" fill="#9c8763">SHIZUOKA CRAFT BEER</text>
</svg>
