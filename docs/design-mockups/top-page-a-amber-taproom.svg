<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900" viewBox="0 0 390 900" font-family="'Hiragino Sans','Yu Gothic',sans-serif">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="60%" stop-color="#1b120c"/>
    </linearGradient>
    <linearGradient id="mapA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a1c"/>
      <stop offset="100%" stop-color="#221609"/>
    </linearGradient>
    <linearGradient id="photo1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8672c"/>
      <stop offset="100%" stop-color="#5e3a1c"/>
    </linearGradient>
    <linearGradient id="photo2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c98a3a"/>
      <stop offset="100%" stop-color="#7a4d1e"/>
    </linearGradient>
  </defs>

  <rect width="390" height="900" fill="url(#bgA)"/>

  <!-- Header -->
  <rect x="0" y="0" width="390" height="60" fill="#1b120c" opacity="0.95"/>
  <line x1="0" y1="60" x2="390" y2="60" stroke="#3a2a1c" stroke-width="1"/>
  <text x="24" y="37" font-size="22">🍺</text>
  <text x="52" y="38" font-size="19" font-weight="700" fill="#e8b458" font-family="Georgia, serif">Beer Salon</text>
  <circle cx="322" cy="30" r="15" fill="none"/>
  <text x="312" y="37" font-size="18" fill="#e8b458">🔔</text>
  <text x="345" y="37" font-size="18" fill="#e8b458">👤</text>

  <!-- Hero -->
  <text x="24" y="106" font-size="23" font-weight="700" fill="#f3e6d3" font-family="Georgia, serif">今夜、どこで</text>
  <text x="24" y="134" font-size="23" font-weight="700" fill="#e8b458" font-family="Georgia, serif">乾杯する？</text>
  <text x="24" y="158" font-size="12" fill="#c9a67d">静岡県内のクラフトビール専門店を探す</text>

  <!-- Search card -->
  <rect x="20" y="176" width="350" height="112" rx="18" fill="#241811" stroke="#4a3624"/>
  <rect x="36" y="192" width="318" height="40" rx="12" fill="#1b120c" stroke="#4a3624"/>
  <text x="52" y="217" font-size="14" fill="#e8b458">🔍</text>
  <text x="76" y="217" font-size="12" fill="#7a6650">店名・タグで検索</text>
  <rect x="36" y="244" width="153" height="30" rx="15" fill="#3a2a1c" stroke="#5a4128"/>
  <text x="112" y="264" font-size="11" font-weight="700" fill="#e8b458" text-anchor="middle">📍 市町村</text>
  <rect x="201" y="244" width="153" height="30" rx="15" fill="#3a2a1c" stroke="#5a4128"/>
  <text x="277" y="264" font-size="11" font-weight="700" fill="#e8b458" text-anchor="middle">🍻 カテゴリ</text>

  <!-- Map -->
  <rect x="20" y="304" width="350" height="140" rx="18" fill="url(#mapA)" stroke="#4a3624"/>
  <text x="195" y="378" font-size="12" fill="#7a6650" text-anchor="middle">Google Maps エリア</text>
  <text x="120" y="345" font-size="18">📍</text>
  <text x="270" y="360" font-size="18">📍</text>
  <text x="160" y="410" font-size="18">📍</text>

  <line x1="20" y1="466" x2="370" y2="466" stroke="#d68c2d" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>

  <!-- Section title -->
  <text x="20" y="500" font-size="17" font-weight="700" fill="#e8b458" font-family="Georgia, serif">近くのビアバー</text>

  <!-- Card 1 -->
  <rect x="20" y="516" width="350" height="110" rx="16" fill="#241811" stroke="#3a2a1c"/>
  <rect x="20" y="516" width="120" height="72" rx="16" fill="url(#photo1)"/>
  <rect x="144" y="516" width="97" height="72" fill="url(#photo2)"/>
  <rect x="245" y="516" width="105" height="72" rx="16" fill="url(#photo1)"/>
  <text x="34" y="612" font-size="13" font-weight="700" fill="#f3e6d3">クラフトビアバー 静岡</text>
  <text x="34" y="628" font-size="11" fill="#c9a67d">静岡県 ・ 静岡市</text>

  <!-- Card 2 -->
  <rect x="20" y="636" width="350" height="110" rx="16" fill="#241811" stroke="#3a2a1c"/>
  <rect x="20" y="636" width="120" height="72" rx="16" fill="url(#photo2)"/>
  <rect x="144" y="636" width="97" height="72" fill="url(#photo1)"/>
  <rect x="245" y="636" width="105" height="72" rx="16" fill="url(#photo2)"/>
  <text x="34" y="732" font-size="13" font-weight="700" fill="#f3e6d3">ブルワリータップ 浜松</text>
  <text x="34" y="748" font-size="11" fill="#c9a67d">静岡県 ・ 浜松市</text>

  <!-- Card 3 -->
  <rect x="20" y="756" width="350" height="110" rx="16" fill="#241811" stroke="#3a2a1c"/>
  <rect x="20" y="756" width="120" height="72" rx="16" fill="url(#photo1)"/>
  <rect x="144" y="756" width="97" height="72" fill="url(#photo2)"/>
  <rect x="245" y="756" width="105" height="72" rx="16" fill="url(#photo1)"/>
  <text x="34" y="852" font-size="13" font-weight="700" fill="#f3e6d3">ビアホール 沼津</text>
  <text x="34" y="868" font-size="11" fill="#c9a67d">静岡県 ・ 沼津市</text>

  <!-- Bottom nav -->
  <rect x="0" y="840" width="390" height="60" fill="#1b120c"/>
  <line x1="0" y1="840" x2="390" y2="840" stroke="#3a2a1c" stroke-width="1"/>
  <text x="45" y="865" font-size="16" fill="#e8b458" text-anchor="middle">⭐</text>
  <text x="45" y="880" font-size="8" fill="#e8b458" text-anchor="middle">お気に入り</text>
  <text x="130" y="865" font-size="16" fill="#7a6650" text-anchor="middle">📜</text>
  <text x="130" y="880" font-size="8" fill="#7a6650" text-anchor="middle">タイムライン</text>
  <circle cx="195" cy="852" r="24" fill="#e8b458"/>
  <text x="195" y="859" font-size="20" fill="#1b120c" text-anchor="middle">＋</text>
  <text x="260" y="865" font-size="16" fill="#7a6650" text-anchor="middle">🕒</text>
  <text x="260" y="880" font-size="8" fill="#7a6650" text-anchor="middle">閲覧履歴</text>
  <text x="345" y="865" font-size="16" fill="#7a6650" text-anchor="middle">⚙️</text>
  <text x="345" y="880" font-size="8" fill="#7a6650" text-anchor="middle">その他</text>
</svg>
