<svg width="375" height="812" viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c-header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d3b4f"/>
      <stop offset="100%" stop-color="#145374"/>
    </linearGradient>
    <linearGradient id="c-map" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd3e8"/>
      <stop offset="100%" stop-color="#1e7d97"/>
    </linearGradient>
    <clipPath id="c-frame">
      <rect x="0" y="0" width="375" height="812" rx="36"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="375" height="812" rx="36" fill="#f2f8fa"/>

  <g clip-path="url(#c-frame)">
    <!-- Header -->
    <rect x="0" y="0" width="375" height="88" fill="url(#c-header)"/>
    <path d="M0,88 C90,68 280,110 375,80 L375,88 L0,88 Z" fill="#0d3b4f" opacity="0.4"/>
    <text x="22" y="52" font-family="'Hiragino Sans', sans-serif" font-size="22" font-weight="700" fill="#ffffff">Beer Salon</text>
    <circle cx="303" cy="44" r="16" fill="#ffffff" opacity="0.15"/>
    <text x="303" y="50" font-size="15" text-anchor="middle" fill="#ffffff">🔔</text>
    <circle cx="345" cy="44" r="16" fill="#ffffff" opacity="0.15"/>
    <text x="345" y="50" font-size="15" text-anchor="middle" fill="#ffffff">👤</text>

    <!-- Search bar -->
    <rect x="20" y="104" width="335" height="46" rx="23" fill="#ffffff" stroke="#bfe3ee" stroke-width="1.5"/>
    <text x="42" y="132" font-size="14" fill="#4b7c8c">🔍 エリア・ビールを検索</text>

    <!-- City chips -->
    <g font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#0d3b4f">
      <rect x="20" y="162" width="66" height="30" rx="15" fill="#ff8c5a"/>
      <text x="53" y="181" text-anchor="middle" fill="#ffffff" font-weight="700">静岡市</text>
      <rect x="94" y="162" width="66" height="30" rx="15" fill="#ffffff" stroke="#bfe3ee"/>
      <text x="127" y="181" text-anchor="middle">浜松市</text>
      <rect x="168" y="162" width="60" height="30" rx="15" fill="#ffffff" stroke="#bfe3ee"/>
      <text x="198" y="181" text-anchor="middle">沼津市</text>
      <rect x="236" y="162" width="60" height="30" rx="15" fill="#ffffff" stroke="#bfe3ee"/>
      <text x="266" y="181" text-anchor="middle">熱海市</text>
      <rect x="304" y="162" width="60" height="30" rx="15" fill="#ffffff" stroke="#bfe3ee"/>
      <text x="334" y="181" text-anchor="middle">富士市</text>
    </g>

    <!-- Category chips -->
    <g font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#145374">
      <rect x="20" y="200" width="58" height="28" rx="14" fill="#e4f4f8"/>
      <text x="49" y="218" text-anchor="middle">IPA</text>
      <rect x="84" y="200" width="80" height="28" rx="14" fill="#e4f4f8"/>
      <text x="124" y="218" text-anchor="middle">ピルスナー</text>
      <rect x="170" y="200" width="70" height="28" rx="14" fill="#e4f4f8"/>
      <text x="205" y="218" text-anchor="middle">スタウト</text>
      <rect x="246" y="200" width="64" height="28" rx="14" fill="#e4f4f8"/>
      <text x="278" y="218" text-anchor="middle">セゾン</text>
    </g>

    <!-- Map area: 駿河湾・伊豆をイメージ -->
    <rect x="20" y="244" width="335" height="196" rx="18" fill="url(#c-map)"/>
    <path d="M20,400 Q90,370 150,400 T280,400 T355,388 L355,440 L20,440 Z" fill="#ffffff" opacity="0.18"/>
    <path d="M20,410 Q100,385 190,412 T355,405 L355,440 L20,440 Z" fill="#ffffff" opacity="0.28"/>
    <!-- 富士山シルエット -->
    <path d="M255,340 L285,270 L300,300 L325,255 L355,340 Z" fill="#ffffff" opacity="0.5"/>
    <path d="M310,285 L325,255 L340,285 Z" fill="#ffffff" opacity="0.8"/>
    <!-- pin markers -->
    <circle cx="90" cy="300" r="9" fill="#ff8c5a" stroke="#ffffff" stroke-width="2"/>
    <circle cx="150" cy="330" r="9" fill="#ff8c5a" stroke="#ffffff" stroke-width="2"/>
    <circle cx="200" cy="290" r="9" fill="#ff8c5a" stroke="#ffffff" stroke-width="2"/>
    <text x="20" y="270" font-size="11" fill="#ffffff" opacity="0.85">駿河湾 × 富士山ビュー</text>

    <!-- Store list heading -->
    <text x="20" y="472" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#0d3b4f">近くのお店</text>

    <!-- Store card 1 -->
    <rect x="20" y="486" width="335" height="118" rx="16" fill="#ffffff" stroke="#e1eff3"/>
    <rect x="20" y="486" width="4" height="118" rx="2" fill="#ff8c5a"/>
    <rect x="36" y="500" width="42" height="42" rx="8" fill="#bfe3ee"/>
    <rect x="82" y="500" width="42" height="42" rx="8" fill="#8fd3e8"/>
    <rect x="36" y="546" width="42" height="42" rx="8" fill="#1e7d97"/>
    <rect x="82" y="546" width="42" height="42" rx="8" fill="#145374"/>
    <text x="138" y="514" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#0d3b4f">清水みなとブルーイング</text>
    <text x="138" y="536" font-size="12" fill="#4b7c8c">静岡県 静岡市清水区</text>
    <rect x="138" y="548" width="72" height="22" rx="11" fill="#e4f4f8"/>
    <text x="174" y="563" font-size="10" text-anchor="middle" fill="#145374">港町IPA</text>

    <!-- Store card 2 -->
    <rect x="20" y="614" width="335" height="118" rx="16" fill="#ffffff" stroke="#e1eff3"/>
    <rect x="20" y="614" width="4" height="118" rx="2" fill="#ff8c5a"/>
    <rect x="36" y="628" width="42" height="42" rx="8" fill="#8fd3e8"/>
    <rect x="82" y="628" width="42" height="42" rx="8" fill="#bfe3ee"/>
    <rect x="36" y="674" width="42" height="42" rx="8" fill="#145374"/>
    <rect x="82" y="674" width="42" height="42" rx="8" fill="#1e7d97"/>
    <text x="138" y="642" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#0d3b4f">伊豆コーストタップルーム</text>
    <text x="138" y="664" font-size="12" fill="#4b7c8c">静岡県 熱海市</text>
    <rect x="138" y="676" width="80" height="22" rx="11" fill="#e4f4f8"/>
    <text x="178" y="691" font-size="10" text-anchor="middle" fill="#145374">サンセットエール</text>

    <!-- Footer -->
    <rect x="0" y="746" width="375" height="66" fill="#ffffff"/>
    <line x1="0" y1="746" x2="375" y2="746" stroke="#e1eff3"/>
    <g font-family="'Hiragino Sans', sans-serif" font-size="10" fill="#4b7c8c" text-anchor="middle">
      <text x="55" y="772" font-size="16">★</text>
      <text x="55" y="792">お気に入り</text>
      <text x="150" y="772" font-size="16" fill="#ff8c5a">📜</text>
      <text x="150" y="792" fill="#ff8c5a" font-weight="700">タイムライン</text>
      <text x="230" y="772" font-size="16">＋</text>
      <text x="230" y="792">投稿</text>
      <text x="320" y="772" font-size="16">🕒</text>
      <text x="320" y="792">履歴</text>
    </g>
  </g>

  <rect x="1" y="1" width="373" height="810" rx="35" fill="none" stroke="#0d3b4f" stroke-width="2"/>
</svg>
