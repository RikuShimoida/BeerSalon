<svg width="375" height="812" viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="d-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f5233"/>
      <stop offset="100%" stop-color="#4a7c59"/>
    </linearGradient>
    <linearGradient id="d-map" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9c9a4"/>
      <stop offset="100%" stop-color="#4a7c59"/>
    </linearGradient>
    <clipPath id="d-frame">
      <rect x="0" y="0" width="375" height="812" rx="36"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="375" height="812" rx="36" fill="#f7f3e8"/>

  <g clip-path="url(#d-frame)">
    <!-- Header -->
    <rect x="0" y="0" width="375" height="88" fill="url(#d-header)"/>
    <text x="22" y="52" font-family="'Hiragino Sans', sans-serif" font-size="22" font-weight="700" fill="#f2c14e">Beer Salon</text>
    <circle cx="303" cy="44" r="16" fill="#ffffff" opacity="0.15"/>
    <text x="303" y="50" font-size="15" text-anchor="middle" fill="#ffffff">🔔</text>
    <circle cx="345" cy="44" r="16" fill="#ffffff" opacity="0.15"/>
    <text x="345" y="50" font-size="15" text-anchor="middle" fill="#ffffff">👤</text>

    <!-- Search bar -->
    <rect x="20" y="104" width="335" height="46" rx="12" fill="#ffffff" stroke="#d8cfa8" stroke-width="1.5"/>
    <text x="42" y="132" font-size="14" fill="#5c6b52">🔍 エリア・ビールを検索</text>

    <!-- City chips -->
    <g font-family="'Hiragino Sans', sans-serif" font-size="12">
      <rect x="20" y="162" width="66" height="30" rx="8" fill="#4a7c59"/>
      <text x="53" y="181" text-anchor="middle" fill="#ffffff" font-weight="700">静岡市</text>
      <rect x="94" y="162" width="66" height="30" rx="8" fill="#ffffff" stroke="#d8cfa8"/>
      <text x="127" y="181" text-anchor="middle" fill="#3f4d3a">浜松市</text>
      <rect x="168" y="162" width="60" height="30" rx="8" fill="#ffffff" stroke="#d8cfa8"/>
      <text x="198" y="181" text-anchor="middle" fill="#3f4d3a">島田市</text>
      <rect x="236" y="162" width="60" height="30" rx="8" fill="#ffffff" stroke="#d8cfa8"/>
      <text x="266" y="181" text-anchor="middle" fill="#3f4d3a">掛川市</text>
      <rect x="304" y="162" width="60" height="30" rx="8" fill="#ffffff" stroke="#d8cfa8"/>
      <text x="334" y="181" text-anchor="middle" fill="#3f4d3a">富士市</text>
    </g>

    <!-- Category chips -->
    <g font-family="'Hiragino Sans', sans-serif" font-size="12" fill="#2f5233">
      <rect x="20" y="200" width="58" height="28" rx="14" fill="#eef2e2"/>
      <text x="49" y="218" text-anchor="middle">IPA</text>
      <rect x="84" y="200" width="80" height="28" rx="14" fill="#eef2e2"/>
      <text x="124" y="218" text-anchor="middle">ピルスナー</text>
      <rect x="170" y="200" width="70" height="28" rx="14" fill="#eef2e2"/>
      <text x="205" y="218" text-anchor="middle">スタウト</text>
      <rect x="246" y="200" width="72" height="28" rx="14" fill="#eef2e2"/>
      <text x="282" y="218" text-anchor="middle">和紅茶エール</text>
    </g>

    <!-- Map area: 茶畑をイメージした緑のグラデーション + 畝模様 -->
    <rect x="20" y="244" width="335" height="196" rx="14" fill="url(#d-map)"/>
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="3">
      <path d="M20,280 Q90,270 160,280 T300,280 T355,275"/>
      <path d="M20,320 Q90,310 160,320 T300,320 T355,315"/>
      <path d="M20,360 Q90,350 160,360 T300,360 T355,355"/>
      <path d="M20,400 Q90,390 160,400 T300,400 T355,395"/>
    </g>
    <circle cx="110" cy="300" r="9" fill="#f2c14e" stroke="#ffffff" stroke-width="2"/>
    <circle cx="200" cy="340" r="9" fill="#f2c14e" stroke="#ffffff" stroke-width="2"/>
    <circle cx="260" cy="290" r="9" fill="#f2c14e" stroke="#ffffff" stroke-width="2"/>
    <text x="20" y="270" font-size="11" fill="#ffffff" opacity="0.9">牧之原台地の茶畑エリア</text>

    <!-- Store list heading -->
    <text x="20" y="472" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2f5233">近くのお店</text>

    <!-- Store card 1 -->
    <rect x="20" y="486" width="335" height="118" rx="12" fill="#ffffff" stroke="#e7e0c8"/>
    <rect x="20" y="486" width="335" height="4" rx="2" fill="#f2c14e"/>
    <rect x="36" y="500" width="42" height="42" rx="6" fill="#a9c9a4"/>
    <rect x="82" y="500" width="42" height="42" rx="6" fill="#8fb589"/>
    <rect x="36" y="546" width="42" height="42" rx="6" fill="#4a7c59"/>
    <rect x="82" y="546" width="42" height="42" rx="6" fill="#d8cfa8"/>
    <text x="138" y="514" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2f5233">牧之原茶畑ブルーパブ</text>
    <text x="138" y="536" font-size="12" fill="#6d7a63">静岡県 島田市</text>
    <rect x="138" y="548" width="88" height="22" rx="11" fill="#eef2e2"/>
    <text x="182" y="563" font-size="10" text-anchor="middle" fill="#2f5233">和紅茶セゾン</text>

    <!-- Store card 2 -->
    <rect x="20" y="614" width="335" height="118" rx="12" fill="#ffffff" stroke="#e7e0c8"/>
    <rect x="20" y="614" width="335" height="4" rx="2" fill="#f2c14e"/>
    <rect x="36" y="628" width="42" height="42" rx="6" fill="#8fb589"/>
    <rect x="82" y="628" width="42" height="42" rx="6" fill="#a9c9a4"/>
    <rect x="36" y="674" width="42" height="42" rx="6" fill="#d8cfa8"/>
    <rect x="82" y="674" width="42" height="42" rx="6" fill="#4a7c59"/>
    <text x="138" y="642" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#2f5233">駿府静岡クラフト醸造所</text>
    <text x="138" y="664" font-size="12" fill="#6d7a63">静岡県 静岡市葵区</text>
    <rect x="138" y="676" width="72" height="22" rx="11" fill="#eef2e2"/>
    <text x="174" y="691" font-size="10" text-anchor="middle" fill="#2f5233">緑茶IPA</text>

    <!-- Footer -->
    <rect x="0" y="746" width="375" height="66" fill="#f7f3e8"/>
    <line x1="0" y1="746" x2="375" y2="746" stroke="#e7e0c8"/>
    <g font-family="'Hiragino Sans', sans-serif" font-size="10" fill="#6d7a63" text-anchor="middle">
      <text x="55" y="772" font-size="16">★</text>
      <text x="55" y="792">お気に入り</text>
      <text x="150" y="772" font-size="16" fill="#2f5233">📜</text>
      <text x="150" y="792" fill="#2f5233" font-weight="700">タイムライン</text>
      <text x="230" y="772" font-size="16">＋</text>
      <text x="230" y="792">投稿</text>
      <text x="320" y="772" font-size="16">🕒</text>
      <text x="320" y="792">履歴</text>
    </g>
  </g>

  <rect x="1" y="1" width="373" height="810" rx="35" fill="none" stroke="#2f5233" stroke-width="2"/>
</svg>
