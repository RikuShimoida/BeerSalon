<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900" viewBox="0 0 390 900" font-family="'Hiragino Sans','Yu Gothic',sans-serif">
  <defs>
    <linearGradient id="mapB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcebc9"/>
      <stop offset="100%" stop-color="#e5f0d3"/>
    </linearGradient>
    <linearGradient id="photo3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6c66b"/>
      <stop offset="100%" stop-color="#e8942c"/>
    </linearGradient>
    <linearGradient id="photo4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a9cf7c"/>
      <stop offset="100%" stop-color="#5b7a3a"/>
    </linearGradient>
  </defs>

  <rect width="390" height="900" fill="#fbf7ee"/>

  <!-- Header -->
  <rect x="0" y="0" width="390" height="60" fill="#fbf7ee"/>
  <line x1="0" y1="60" x2="390" y2="60" stroke="#eee3c8" stroke-width="1"/>
  <text x="24" y="37" font-size="22">🌿</text>
  <text x="52" y="38" font-size="19" font-weight="700" fill="#5b7a3a">Beer Salon</text>
  <circle cx="313" cy="30" r="16" fill="#ffffff"/>
  <text x="306" y="36" font-size="15" fill="#5b7a3a">🔔</text>
  <circle cx="353" cy="30" r="16" fill="#ffffff"/>
  <text x="346" y="36" font-size="15" fill="#5b7a3a">👤</text>

  <!-- Hero -->
  <text x="24" y="104" font-size="22" font-weight="700" fill="#2e3a24">好きな一杯を、</text>
  <text x="24" y="132" font-size="22" font-weight="700" fill="#e8942c">見つけよう。</text>
  <text x="24" y="156" font-size="12" fill="#7c8a6a">クラフトビール専門店を検索</text>

  <!-- Search card -->
  <rect x="20" y="174" width="350" height="112" rx="24" fill="#ffffff"/>
  <rect x="36" y="190" width="318" height="40" rx="16" fill="#f3f1e4"/>
  <text x="52" y="215" font-size="14" fill="#5b7a3a">🔍</text>
  <text x="76" y="215" font-size="12" fill="#a3ac91">店名・タグで検索</text>
  <rect x="36" y="242" width="153" height="30" rx="15" fill="#eaf3df"/>
  <text x="112" y="262" font-size="11" font-weight="700" fill="#5b7a3a" text-anchor="middle">📍 市町村</text>
  <rect x="201" y="242" width="153" height="30" rx="15" fill="#fdecd6"/>
  <text x="277" y="262" font-size="11" font-weight="700" fill="#e8942c" text-anchor="middle">🍻 カテゴリ</text>

  <!-- Map -->
  <rect x="20" y="302" width="350" height="140" rx="24" fill="url(#mapB)"/>
  <text x="195" y="376" font-size="12" fill="#8fa176" text-anchor="middle">Google Maps エリア</text>
  <text x="120" y="343" font-size="18">📍</text>
  <text x="270" y="358" font-size="18">📍</text>
  <text x="160" y="408" font-size="18">📍</text>

  <!-- Section title -->
  <text x="20" y="480" font-size="17" font-weight="700" fill="#5b7a3a">近くのビアバー</text>

  <!-- Card 1 -->
  <rect x="20" y="496" width="350" height="110" rx="20" fill="#ffffff"/>
  <rect x="20" y="496" width="120" height="72" rx="20" fill="url(#photo3)"/>
  <rect x="144" y="496" width="97" height="72" fill="url(#photo4)"/>
  <rect x="245" y="496" width="105" height="72" rx="20" fill="url(#photo3)"/>
  <text x="34" y="592" font-size="13" font-weight="700" fill="#2e3a24">クラフトビアバー 静岡</text>
  <text x="34" y="608" font-size="11" fill="#8fa176">静岡県 ・ 静岡市</text>
  <text x="340" y="592" font-size="14" fill="#e8942c" text-anchor="middle">★</text>

  <!-- Card 2 -->
  <rect x="20" y="616" width="350" height="110" rx="20" fill="#ffffff"/>
  <rect x="20" y="616" width="120" height="72" rx="20" fill="url(#photo4)"/>
  <rect x="144" y="616" width="97" height="72" fill="url(#photo3)"/>
  <rect x="245" y="616" width="105" height="72" rx="20" fill="url(#photo4)"/>
  <text x="34" y="712" font-size="13" font-weight="700" fill="#2e3a24">ブルワリータップ 浜松</text>
  <text x="34" y="728" font-size="11" fill="#8fa176">静岡県 ・ 浜松市</text>
  <text x="340" y="712" font-size="14" fill="#c9d3bb" text-anchor="middle">☆</text>

  <!-- Card 3 -->
  <rect x="20" y="736" width="350" height="110" rx="20" fill="#ffffff"/>
  <rect x="20" y="736" width="120" height="72" rx="20" fill="url(#photo3)"/>
  <rect x="144" y="736" width="97" height="72" fill="url(#photo4)"/>
  <rect x="245" y="736" width="105" height="72" rx="20" fill="url(#photo3)"/>
  <text x="34" y="832" font-size="13" font-weight="700" fill="#2e3a24">ビアホール 沼津</text>
  <text x="34" y="848" font-size="11" fill="#8fa176">静岡県 ・ 沼津市</text>
  <text x="340" y="832" font-size="14" fill="#c9d3bb" text-anchor="middle">☆</text>

  <!-- Bottom nav -->
  <rect x="0" y="840" width="390" height="60" rx="24" fill="#ffffff"/>
  <text x="45" y="865" font-size="16" fill="#e8942c" text-anchor="middle">⭐</text>
  <text x="45" y="880" font-size="8" fill="#e8942c" text-anchor="middle">お気に入り</text>
  <text x="130" y="865" font-size="16" fill="#a3ac91" text-anchor="middle">📜</text>
  <text x="130" y="880" font-size="8" fill="#a3ac91" text-anchor="middle">タイムライン</text>
  <circle cx="195" cy="852" r="24" fill="#5b7a3a"/>
  <text x="195" y="859" font-size="20" fill="#ffffff" text-anchor="middle">＋</text>
  <text x="260" y="865" font-size="16" fill="#a3ac91" text-anchor="middle">🕒</text>
  <text x="260" y="880" font-size="8" fill="#a3ac91" text-anchor="middle">閲覧履歴</text>
  <text x="345" y="865" font-size="16" fill="#a3ac91" text-anchor="middle">⚙️</text>
  <text x="345" y="880" font-size="8" fill="#a3ac91" text-anchor="middle">その他</text>
</svg>
